version: 0.2
env:
  variables:
    MY_SERVER_NAME: "default_server_name"
phases:
  pre_build:
    commands:
      - echo ${MY_ID}
      - echo ${MY_REGION}
      - aws ecr get-login-password --region ${MY_REGION} | docker login --username AWS --password-stdin ${MY_ID}.dkr.ecr.${MY_REGION}.amazonaws.com
  build:
    commands:
      - echo Building the Docker image...
      - echo Building from ${MY_NODE_REPO}
      - docker build --build-arg MY_NODE_REPO=${MY_NODE_REPO} -t masktego_server .
      - docker tag masktego_server:latest ${MY_ID}.dkr.ecr.${MY_REGION}.amazonaws.com/masktego_server:latest
  post_build:
    commands:
      - echo "Pushing to Docker image..."
      - docker push ${MY_ID}.dkr.ecr.${MY_REGION}.amazonaws.com/masktego_server:latest